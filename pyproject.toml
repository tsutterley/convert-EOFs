[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-eofs"
version = "0.0.1"
description = "Python tools for processing EOFs to be consistent with GRACE/GRACE-FO estimates"
keywords = [
    "GRACE/GRACE-FO",
    "ICESat-2",
    "GSFC-FDM",
    "spherical harmonics",
    "satellite geodesy",
]
authors = [
    { name = "Tyler Sutterley" },
    { email = "tsutterl@uw.edu" },
]
maintainers = [
    { name = "convert-EOFs contributors" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }

requires-python = "~=3.9"
dependencies = ["gravity-toolkit", "model-harmonics", "geoid-toolkit"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/tsutterley/convert-EOFs"
Repository = "https://github.com/tsutterley/convert-EOFs"
Issues = "https://github.com/tsutterley/convert-EOFs/issues"

[project.scripts]
"convert_atl11_atl15_heights.py" = "convert_eofs.convert_atl11_atl15_heights:main"
"convert_basin_masks.py" = "convert_eofs.convert_basin_masks:main"
"convert_elastic_heights.py" = "convert_eofs.convert_elastic_heights:main"
"convert_height_eofs.py" = "convert_eofs.convert_height_eofs:main"
"convert_smb_fac_eofs.py" = "convert_eofs.convert_smb_fac_eofs:main"
"convert_longterm_eofs.py" = "convert_eofs.convert_longterm_eofs:main"

[tool.setuptools.packages.find]
exclude = ["run*"]

[tool.ruff]
line-length = 80

[tool.pixi.workspace]
name = "convert-eofs"
authors = ["convert-EOFs contributors"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
convert-eofs = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.dependencies]
boto3 = "*"
future = "*"
lxml = "*"
matplotlib-base = "*"
netcdf4 = "*"
numpy = "*"
python-dateutil = "*"
pyyaml = "*"
scipy = "*"
cdsapi = "*"
ecmwf-api-client = "*"
fiona = "*"
pyproj = "*"
shapely = "*"
scikit-learn = "*"
